# Source manifest for `python -m fetch`.
#
# `id` is the unique logical source id used by --id. `dest` is the folder under
# data/raw/ (defaults to id); `subdir` nests an entry inside a shared source
# folder. `resolver` is a key in fetch/resolvers or fetch/harvesters.
#
# status: verified (a concrete file/list was checked) | manual | skip.
# redistribute: false for NC licences, "do not redistribute" or unknown terms.
# large: true means the source is fetched only with --large.

# ------------------------------------------------------------------ captures
- id: prize-papers
  group: captures
  title: Prize Papers portal (Goobi viewer)
  resolver: prizepapers
  url: https://portal.prizepapers.de/api/v1/
  licence: Metadata terms unstated; images research-only
  tier: T1
  status: verified
  redistribute: false
  approx_bytes: 20000000
  rate_limit: 1.0
  notes: "Fetch metadata only. robots.txt disallows /search/ and /oai; use /api/v1/index/query/."

- id: wikidata
